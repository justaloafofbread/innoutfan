<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-N-Out Snake: Animal Style</title>
    <style>
        /* --- MENU BAR STYLING --- */
        .common {
            background-color: #e31837; /* In-N-Out Red */
            padding: 15px;
            text-align: center;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            border-bottom: 4px solid #ffc220; /* In-N-Out Yellow */
        }

        .common a {
            color: white;
            text-decoration: none;
            font-family: 'Arial Black', sans-serif;
            margin: 0 10px;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .common a:hover {
            color: #ffc220;
        }

        /* --- GAME STYLING --- */
        body {
            background-color: #004e2e;
            display: flex;
            flex-direction: column; /* Allows nav to stay at top */
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial Black', sans-serif;
            color: white;
            overflow: hidden;
        }

        .game-container {
            margin-top: 60px; /* Pushes game down below the nav bar */
            text-align: center;
            position: relative;
        }

        .neon-text {
            color: #e31837;
            text-shadow: 3px 3px 0px #ffc220;
            font-size: 3rem;
            margin: 0 0 10px 0;
        }

        .yellow-text { color: #ffc220; }

        .score-board {
            margin-bottom: 10px;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
        }

        canvas {
            border: 10px solid #e31837;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #f2f2f2 25%, transparent 25%), 
                linear-gradient(-45deg, #f2f2f2 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #f2f2f2 75%), 
                linear-gradient(-45deg, transparent 75%, #f2f2f2 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
        }

        #start-btn {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 1.5rem;
            background-color: #e31837;
            color: white;
            border: 4px solid #ffc220;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Arial Black', sans-serif;
            z-index: 10;
        }

        #start-btn:hover { background-color: #ffc220; color: #e31837; }

        .controls {
            margin-top: 15px;
            color: #ffc220;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <nav class="common">
        <a href="fromscratch.html">In-N-Out Page |</a>
        <a href="index.html">About Mallory |</a>
        <a href="#">Game</a>
    </nav>

    <div class="game-container">
        <h1 class="neon-text">IN-N-OUT <span class="yellow-text">SNAKE</span></h1>
        
        <div class="score-board">
            <span>SCORE: <span id="score">0</span></span>
            <span>HIGH SCORE: <span id="highScore">0</span></span>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button id="start-btn">ORDER UP! (START)</button>
        
        <p class="controls">Use Arrow Keys to Slither!</p>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const startBtn = document.getElementById("start-btn");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        highScoreElement.innerText = highScore;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5, type: '🍔' };
        let dx = 0;
        let dy = 0;
        let gameActive = false;

        function init() {
            draw(); 
        }

        function startGame() {
            startBtn.style.display = "none";
            score = 0;
            scoreElement.innerText = score;
            snake = [{ x: 10, y: 10 }];
            dx = 1; 
            dy = 0;
            gameActive = true;
            createFood();
            gameLoop();
        }

        function gameLoop() {
            if (!gameActive) return;

            setTimeout(() => {
                update();
                draw();
                gameLoop();
            }, 100);
        }

        function update() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return gameOver();
            }

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return gameOver();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "18px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(food.type, food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2);

            snake.forEach((part, index) => {
                ctx.fillStyle = "#ffc220";
                ctx.strokeStyle = "#e31837";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                
                if (index === 0) {
                    ctx.fillStyle = "black";
                    ctx.fillRect(part.x * gridSize + 4, part.y * gridSize + 4, 3, 3);
                    ctx.fillRect(part.x * gridSize + 13, part.y * gridSize + 4, 3, 3);
                }
            });
        }

        function createFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            food.type = Math.random() > 0.5 ? '🍔' : '🍟';
        }

        function gameOver() {
            gameActive = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snakeHighScore", highScore);
                highScoreElement.innerText = highScore;
            }
            alert("Crash! Your total score: " + score);
            startBtn.innerText = "RE-ORDER?";
            startBtn.style.display = "block";
        }

        function handleInput(e) {
            if (!gameActive) return;
            if([37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
            if (e.keyCode === 37 && dx === 0) { dx = -1; dy = 0; } 
            if (e.keyCode === 38 && dy === 0) { dx = 0; dy = -1; } 
            if (e.keyCode === 39 && dx === 0) { dx = 1; dy = 0; }  
            if (e.keyCode === 40 && dy === 0) { dx = 0; dy = 1; }  
        }

        startBtn.addEventListener("click", startGame);
        window.addEventListener("keydown", handleInput);
        init();
    </script>
</body>
</html>
