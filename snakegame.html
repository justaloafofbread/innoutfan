<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game - In-N-Out Deluxe</title>
<style>
    body {
        margin: 0;
        background: #f4e3c1;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        color: #c62828;
    }

    canvas {
        display: block;
        margin: 20px auto;
        border: 6px solid #c62828;
        border-radius: 10px;
        background: #fff8e1;
    }

    #score {
        font-size: 20px;
        color: #333;
    }

    #overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: rgba(0,0,0,0.75);
        color: white;
    }

    button {
        padding: 12px 20px;
        font-size: 18px;
        cursor: pointer;
        border-radius: 8px;
        border: none;
        background: #ff5252;
        color: white;
    }
</style>
</head>
<body>
    <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-light" id="mainNav">
            <div class="container px-4 px-lg-5">
                
               
                    <i class="fas fa-bars"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav ms-auto py-4 py-lg-0">

                        <li class="nav-item"><a class="nav-link px-lg-3 py-3 py-lg-4" href="../fromscratch.html">In-N-Out Page</a></li>
                    </ul>
                </div>
            </div>

<h1>🐍 In-N-Out Snake</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="420" height="420"></canvas>

<div id="overlay">
    <h2 id="message">Ready to Eat? 🍔</h2>
    <button onclick="startGame()">Start Game</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const gridSize = 21;
const tileCount = canvas.width / gridSize;

let snake, dx, dy, food, score, gameInterval;
let running = false;

const foods = ["🍔", "🍟", "🥤"];

function startGame() {
    snake = [{x: 10, y: 10}];
    dx = 1;
    dy = 0;
    score = 0;
    running = true;

    document.getElementById("score").innerText = "Score: 0";
    document.getElementById("overlay").style.display = "none";

    spawnFood();
    clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, 110);
}

function spawnFood() {
    food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount),
        type: foods[Math.floor(Math.random() * foods.length)]
    };
}

function gameLoop() {
    moveSnake();

    if (checkCollision()) {
        endGame();
        return;
    }

    if (snake[0].x === food.x && snake[0].y === food.y) {
        score++;
        document.getElementById("score").innerText = "Score: " + score;
        spawnFood();
    } else {
        snake.pop();
    }

    draw();
}

function moveSnake() {
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    snake.unshift(head);
}

function checkCollision() {
    const head = snake[0];

    if (head.x < 0 || head.y < 0 || head.x >= tileCount || head.y >= tileCount) {
        return true;
    }

    for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
            return true;
        }
    }

    return false;
}

function endGame() {
    running = false;
    clearInterval(gameInterval);

    document.getElementById("message").innerText =
        "Game Over! Final Score: " + score + " 🍟";
    document.getElementById("overlay").style.display = "flex";
}

function drawTiles() {
    for (let y = 0; y < tileCount; y++) {
        for (let x = 0; x < tileCount; x++) {
            ctx.fillStyle = (x + y) % 2 === 0 ? "#fff3d6" : "#ffe0b2";
            ctx.fillRect(x * gridSize, y * gridSize, gridSize, gridSize);
        }
    }
}

function drawSnake() {
    snake.forEach((segment, index) => {
        const x = segment.x * gridSize + gridSize / 2;
        const y = segment.y * gridSize + gridSize / 2;

        // Gradient body
        const gradient = ctx.createRadialGradient(x, y, 2, x, y, gridSize/2);
        gradient.addColorStop(0, "#66bb6a");
        gradient.addColorStop(1, "#2e7d32");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, gridSize / 2 - 2, 0, Math.PI * 2);
        ctx.fill();

        // Head details
        if (index === 0) {
            ctx.fillStyle = "white";

            // Eyes
            ctx.beginPath();
            ctx.arc(x - 4, y - 4, 2, 0, Math.PI * 2);
            ctx.arc(x + 4, y - 4, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(x - 4, y - 4, 1, 0, Math.PI * 2);
            ctx.arc(x + 4, y - 4, 1, 0, Math.PI * 2);
            ctx.fill();
        }
    });
}

function drawFood() {
    ctx.font = "18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        food.type,
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2
    );
}

function draw() {
    drawTiles();
    drawSnake();
    drawFood();
}

document.addEventListener("keydown", e => {
    if (!running) return;

    switch(e.key) {
        case "ArrowUp":
            if (dy === 0) { dx = 0; dy = -1; }
            break;
        case "ArrowDown":
            if (dy === 0) { dx = 0; dy = 1; }
            break;
        case "ArrowLeft":
            if (dx === 0) { dx = -1; dy = 0; }
            break;
        case "ArrowRight":
            if (dx === 0) { dx = 1; dy = 0; }
            break;
    }
});
</script>


</body>
</html>
